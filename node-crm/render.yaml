services:
  - type: web
    name: crm-cmb-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: node-crm
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_OAUTH_REDIRECT_URI
        value: https://www.crm-cmb.com.br/configuracoes
      - key: META_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GA_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GA_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://crm-cmb.com.br
