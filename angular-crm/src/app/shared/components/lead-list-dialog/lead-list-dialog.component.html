<h2 mat-dialog-title>{{ data.title }} ({{ data.leads.length }})</h2>

<div mat-dialog-content class="lead-list">
  @if (data.leads.length === 0) {
    <p class="lead-list__empty">Nenhum lead encontrado para este filtro.</p>
  }

  @for (lead of data.leads; track lead.id) {
    <button type="button" class="lead-list__row" (click)="showDetails(lead)">
      <span class="lead-list__name">{{ lead.name }}</span>
      <span class="lead-list__status">{{ statusLabel(lead) }}</span>
    </button>
  }
</div>

<div mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Fechar</button>
</div>
