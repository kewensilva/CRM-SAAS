<h2 mat-dialog-title>Excluir empresa</h2>

<div mat-dialog-content>
  <p>Tem certeza que deseja excluir a empresa <strong>{{ data.tenant.name }}</strong>?</p>
</div>

<div mat-dialog-actions align="end">
  <button type="button" mat-button (click)="cancel()">Cancelar</button>
  <button type="button" mat-flat-button color="warn" (click)="confirm()">Excluir</button>
</div>
