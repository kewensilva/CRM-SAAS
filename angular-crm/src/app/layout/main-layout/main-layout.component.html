<div class="main-layout">
  <header class="mobile-topbar">
    <button
      type="button"
      class="mobile-topbar__menu-btn"
      (click)="toggleMobileMenu()"
      aria-label="Abrir menu"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <img src="assets/images/sidebar-logo.png" alt="Logo" class="mobile-topbar__logo" />
  </header>

  @if (isMobileMenuOpen()) {
    <div class="sidebar__backdrop" (click)="closeMobileMenu()"></div>
  }

  <aside
    class="sidebar"
    [class.sidebar--collapsed]="isCollapsed()"
    [class.sidebar--mobile-open]="isMobileMenuOpen()"
  >
    <div class="sidebar__logo">
      <img src="assets/images/sidebar-logo.png" alt="Logo" />
    </div>

    <button
      type="button"
      class="sidebar__toggle"
      (click)="toggleSidebar()"
      [attr.aria-label]="isCollapsed() ? 'Expandir menu' : 'Recolher menu'"
    >
      <mat-icon>{{ isCollapsed() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>

    <nav class="sidebar__nav">
      <a
        *ngFor="let item of menuItems()"
        [routerLink]="item.route"
        routerLinkActive="sidebar__item--active"
        #navLink="routerLinkActive"
        class="sidebar__item"
        (click)="closeMobileMenu()"
      >
        <span class="icon-badge" [class.icon-badge--active]="navLink.isActive">
          <img [src]="item.icon" alt="" />
        </span>
        <span class="sidebar__item-label" *ngIf="!isCollapsed()">{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar__footer">
      <a
        *ngIf="showSettings()"
        [routerLink]="settingsItem.route"
        routerLinkActive="sidebar__item--active"
        #settingsLink="routerLinkActive"
        class="sidebar__item"
        (click)="closeMobileMenu()"
      >
        <span class="icon-badge" [class.icon-badge--active]="settingsLink.isActive">
          <img [src]="settingsItem.icon" alt="" />
        </span>
        <span class="sidebar__item-label" *ngIf="!isCollapsed()">{{ settingsItem.label }}</span>
      </a>

      <button
        type="button"
        *ngIf="session.isOwnerImpersonating()"
        class="sidebar__item sidebar__item--button"
        [disabled]="exitingTenant()"
        (click)="exitTenant()"
      >
        <span class="icon-badge icon-badge--neutral"><mat-icon>arrow_back</mat-icon></span>
        <span class="sidebar__item-label" *ngIf="!isCollapsed()">Voltar para plataforma</span>
      </button>

      <button type="button" class="sidebar__item sidebar__item--button" (click)="logout()">
        <span class="icon-badge icon-badge--neutral"><mat-icon>logout</mat-icon></span>
        <span class="sidebar__item-label" *ngIf="!isCollapsed()">Sair</span>
      </button>
    </div>
  </aside>

  <main class="main-layout__content" [class.main-layout__content--expanded]="isCollapsed()">
    <router-outlet />
  </main>
</div>
